<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Darts 420</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="scanlines"></div>
    
    <div class="container">
        <header>
            <h1 class="neon-title" data-text="DARTS 420">DARTS 420</h1>
            <p class="subtitle">OBJETIVO: 420 EXACTOS</p>
            <p class="rule">Si te pasás, el sobrante se resta.</p>
        </header>

        <div class="toolbar">
            <span class="round-indicator" id="round-indicator">RONDA 1</span>
            <div class="header-actions">
                <button id="btn-open-graph" class="retro-btn compact icon-btn" title="Ver gráfico de puntuación">👁</button>
                <button id="btn-open-profiles" class="retro-btn compact">PERFILES</button>
                <button id="btn-open-history" class="retro-btn compact">HISTORIAL</button>
            </div>
        </div>

        <div class="controls">
            <div class="add-mode-toggle">
                <button id="btn-mode-guest" class="retro-btn compact mode-btn active">JUGADOR NUEVO</button>
                <button id="btn-mode-library" class="retro-btn compact mode-btn">BIBLIOTECA</button>
            </div>

            <div id="guest-add-row" class="add-player-row">
                <input type="text" id="new-player-name" placeholder="NUEVO JUGADOR..." autocomplete="off">
                <button id="btn-add-player" class="retro-btn">AÑADIR</button>
            </div>

            <div id="library-picker-wrap" class="library-picker-wrap hidden">
                <span class="library-label">ELEGÍ JUGADOR:</span>
                <div id="library-picker" class="library-picker"></div>
            </div>
            <p id="library-empty-hint" class="empty-hint hidden">No hay perfiles guardados todavía — creá uno en PERFILES.</p>
        </div>

        <div id="players-container" class="players-grid">
            <!-- Players generated dynamically -->
        </div>

        <div class="turn-bar">
            <button id="btn-advance-turn" class="retro-btn turn-btn">SIGUIENTE TURNO ▶</button>
        </div>

        <div id="winner-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="winner-text" class="neon-title winner-pulse"></h2>
                <h3 class="winner-subtitle">¡Ha clavado el 420!</h3>
                <div class="winner-actions">
                    <button id="btn-next-round" class="retro-btn">SIGUIENTE RONDA</button>
                    <button id="btn-reset" class="retro-btn yellow">RESET</button>
                </div>
            </div>
        </div>

        <div id="profiles-modal" class="modal hidden">
            <div class="modal-content modal-content-wide">
                <h2 class="neon-title">PERFILES</h2>
                <div id="profiles-list" class="profiles-list"></div>
                <div class="profile-form">
                    <input type="text" id="new-profile-name" placeholder="NOMBRE DEL PERFIL..." autocomplete="off">
                    <select id="new-profile-skin"></select>
                    <button id="btn-add-profile" class="retro-btn compact">GUARDAR PERFIL</button>
                </div>
                <button id="btn-close-profiles" class="retro-btn compact yellow">CERRAR</button>
            </div>
        </div>

        <div id="history-modal" class="modal hidden">
            <div class="modal-content modal-content-wide">
                <h2 class="neon-title">HISTORIAL</h2>
                <div id="history-list" class="history-list"></div>
                <button id="btn-close-history" class="retro-btn compact yellow">CERRAR</button>
            </div>
        </div>

        <div id="graph-modal" class="modal hidden">
            <div class="modal-content modal-content-graph">
                <h2 class="neon-title">PUNTUACIÓN</h2>
                <canvas id="score-canvas" class="score-canvas"></canvas>
                <div id="graph-legend" class="graph-legend"></div>
                <button id="btn-close-graph" class="retro-btn compact yellow">CERRAR</button>
            </div>
        </div>
    </div>
    <script src="store.js"></script>
    <script src="script.js"></script>
</body>
</html>
